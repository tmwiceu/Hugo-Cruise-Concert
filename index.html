<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugo เรือสำราญราตรีอมตะ</title>
    <!-- Open Graph Tags สำหรับ preview เวลาส่งลิงก์ใน LINE / Facebook -->
    <meta property="og:title" content="Hugo เรือสำราญราตรีอมตะ - ตั๋วเรือสำราญ VIP" />
    <meta property="og:description" content="กดยืนยันการจองตั๋วเรือสำราญ Hugo ราตรีอมตะ" />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            /* โค้ดไล่เฉดสีโทนฟ้า-ขาวแบบนุ่มนวล */
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 50%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #0369a1; /* สีตัวอักษรโทนน้ำเงินเข้มสบายตา */
        }

        /* Floating background balloons/emojis */
        .bg-element {
            position: absolute;
            font-size: 2.5rem;
            animation: floatSlow 6s ease-in-out infinite alternate;
            user-select: none;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(15deg); }
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2.8rem;
            color: #0369a1;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffb6c1;
            line-height: 1.2;
            word-break: break-word;
        }

        .emoji-bar {
            font-size: 1.5rem;
            margin: 15px 0;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .sub-text {
            font-size: 2.5rem;
            color: #4a4a4a;
            margin-top: 10px;
        }

        .cake {
            font-size: 5rem;
            margin: 20px 0;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Background decorative floating elements -->
    <div class="bg-element" style="top: 10%; left: 8%;">🍻</div>
    <div class="bg-element" style="top: 15%; right: 10%; animation-delay: 1s;">🍻</div>
    <div class="bg-element" style="bottom: 15%; left: 12%; animation-delay: 2s;">🍻</div>
    <div class="bg-element" style="bottom: 10%; right: 8%; animation-delay: 1.5s;">🍻</div>

    <div class="card">
        <div class="emoji-bar">🥳 🎉 🥳 🎉 🥳 🎉</div>
        <h1>Happy Birthday Kub P’Big</h1>
        <div class="cake">🎁✨</div>
        <p class="sub-text"> มีความสุขมากๆๆนะคะ สุขภาพร่างกายแข็งแรง 💕</p>
        <div class="emoji-bar" style="margin-top: 20px;">แกล้งมาก็แกล้งกลับค่ะ555555</div>
    </div>

    <script>
        // ยิงพลุกระดาษทันทีที่เปิดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            // ยิงชุดแรก
            fireConfetti();

            // ยิงซ้ำต่อเนื่องอีกนิดหน่อยเพิ่มความอลังการ
            setTimeout(fireConfetti, 400);
            setTimeout(fireConfetti, 800);
        });

        function fireConfetti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff3366', '#ffb6c1'] });
            fire(0.2, { spread: 60, colors: ['#ffffff', '#a1c4fd'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>
